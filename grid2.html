<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid black;margin; 0px; padding: 0px; box-sizing: context-box;
        @media screen and (max-width:500px){
        .container{}
        }   
        }
        

         
    }       
        @media screen and (min-width: 501px){ 
        .container{display: grid;
        grid-template-areas:
        "header header header header"
        "menu   main  main   aside"
        "rodape rodape rodape rodape"
        ;
        grid-template-rows: 100px 200px 100px
    }    
    }
    #box1{grid-area: header;}
    #box2{grid-area: main;}
    #box10{grid-area: menu}
    </style>
</head>
<body>
    <div class="container">
    <div class="container div box" id="box1">box1</div>
    <div class="container div box" id="box2">box2</div>
    <div class="container div box" id="box3">box3</div>
    <div class="container div box" id="box4">box4</div>
    <div class="container div box" id="box5">box5</div>
    <div class="container div box" id="box6">box6</div>
    <div class="container div box" id="box7">box7</div>
    <div class="container div box" id="box8">box8</div>
    <div class="container div box" id="box9">box9</div>
    <div class="container div box" id="box10">box10</div>
    </div>
</body>
</html>
